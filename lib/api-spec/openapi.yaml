openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: conversations
    description: Conversation and message persistence
paths:
  /account/cloud:
    get:
      operationId: getAccountCloud
      responses:
        "200":
          description: Authenticated user's cloud snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudSnapshot" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
    put:
      operationId: saveAccountCloud
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloudSnapshotInput" }
      responses:
        "200":
          description: Saved snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudSnapshot" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
    delete:
      operationId: deleteAccountCloud
      responses:
        "204": { description: Cloud data erased }
        "401": { $ref: "#/components/responses/ErrorResponse" }
  /devices/pair:
    post:
      operationId: pairPrivateDevice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrivateDeviceInput" }
      responses:
        "200":
          description: Private device credential bound to the device ID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateDeviceAuthorization" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
  /memory:
    get:
      operationId: listPrivateMemory
      parameters:
        - { $ref: "#/components/parameters/PrivateAuthorization" }
      responses:
        "200":
          description: Owned memories
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateMemoryList" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
    post:
      operationId: savePrivateMemory
      parameters:
        - { $ref: "#/components/parameters/PrivateAuthorization" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemoryInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryResult" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
  /memory/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
      - { $ref: "#/components/parameters/PrivateAuthorization" }
    patch:
      operationId: updatePrivateMemory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemoryInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryResult" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
    delete:
      operationId: deletePrivateMemory
      responses:
        "200": { description: Deleted }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /memory/extract:
    post:
      operationId: extractPrivateMemory
      parameters:
        - { $ref: "#/components/parameters/PrivateAuthorization" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemoryExtractionInput" }
      responses:
        "200":
          description: Extracted owned memories
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateMemoryList" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
  /live/pair:
    post:
      operationId: pairLiveDevice
      tags: [live]
      summary: Pair a device using a short-lived code generated on the VM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  minLength: 12
                  maxLength: 32
      responses:
        "200":
          description: Live-only device authorization
          content:
            application/json:
              schema:
                type: object
                required: [credential, expiresAt]
                properties:
                  credential: { type: string }
                  expiresAt: { type: string }
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /live/token:
    post:
      operationId: createLiveToken
      tags: [live]
      summary: Issue one constrained short-lived Gemini Live token
      parameters:
        - in: header
          name: Authorization
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Single-use session credentials and locked configuration
          content:
            application/json:
              schema:
                type: object
                required: [token, expiresAt, sessionSeconds, setup]
                properties:
                  token: { type: string }
                  expiresAt: { type: string }
                  sessionSeconds: { type: integer }
                  setup:
                    type: object
                    additionalProperties: true
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"
        "502":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /conversations:
    parameters:
      - { $ref: "#/components/parameters/PrivateAuthorization" }
    get:
      operationId: listConversations
      tags: [conversations]
      summary: List conversations
      description: Returns all conversations for the device identified by X-Device-Id header, newest first.
      parameters:
        - in: header
          name: X-Device-Id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Conversation list
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Conversation"
                required:
                  - conversations
        "400":
          $ref: "#/components/responses/ErrorResponse"
    post:
      operationId: createConversation
      tags: [conversations]
      summary: Create a conversation
      parameters:
        - in: header
          name: X-Device-Id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationBody"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation:
                    $ref: "#/components/schemas/Conversation"
                required:
                  - conversation
        "400":
          $ref: "#/components/responses/ErrorResponse"

  /conversations/{id}:
    parameters:
      - { $ref: "#/components/parameters/PrivateAuthorization" }
    patch:
      operationId: updateConversation
      tags: [conversations]
      summary: Update a conversation title
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: header
          name: X-Device-Id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation:
                    $ref: "#/components/schemas/Conversation"
                required:
                  - conversation
        "404":
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: deleteConversation
      tags: [conversations]
      summary: Delete a conversation and all its messages
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: header
          name: X-Device-Id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required:
                  - success
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /conversations/{id}/messages:
    parameters:
      - { $ref: "#/components/parameters/PrivateAuthorization" }
    get:
      operationId: listMessages
      tags: [conversations]
      summary: List messages in a conversation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: header
          name: X-Device-Id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Message list
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConversationMessage"
                required:
                  - messages
        "400":
          $ref: "#/components/responses/ErrorResponse"
    post:
      operationId: createMessage
      tags: [conversations]
      summary: Append a message to a conversation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: header
          name: X-Device-Id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageBody"
      responses:
        "201":
          description: Created message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    $ref: "#/components/schemas/ConversationMessage"
                required:
                  - message
        "400":
          $ref: "#/components/responses/ErrorResponse"

components:
  parameters:
    PrivateAuthorization:
      in: header
      name: Authorization
      required: true
      schema: { type: string }
  schemas:
    CloudSnapshotInput:
      type: object
      required: [revision, entries]
      properties:
        revision: { type: integer, minimum: 0 }
        entries:
          type: object
          additionalProperties: { type: string }
    CloudSnapshot:
      type: object
      required: [revision, entries, updatedAt]
      properties:
        revision: { type: integer, minimum: 0 }
        entries:
          type: object
          additionalProperties: { type: string }
        updatedAt: { type: ["string", "null"] }
    PrivateDeviceInput:
      type: object
      required: [code, deviceId]
      properties:
        code: { type: string, minLength: 12, maxLength: 32 }
        deviceId: { type: string, pattern: "^[A-Za-z0-9_-]{8,128}$" }
    PrivateDeviceAuthorization:
      type: object
      required: [credential, expiresAt]
      properties:
        credential: { type: string }
        expiresAt: { type: string }
    MemoryInput:
      type: object
      required: [fact]
      properties:
        fact: { type: string, minLength: 1, maxLength: 500 }
        category: { type: string, maxLength: 30 }
    MemoryExtractionInput:
      type: object
      required: [userMessage, assistantMessage, automaticMemory]
      properties:
        userMessage: { type: string, minLength: 1, maxLength: 8000 }
        assistantMessage: { type: string, minLength: 1, maxLength: 16000 }
        automaticMemory: { type: boolean }
    PrivateMemory:
      type: object
      required: [id, fact, category]
      properties:
        id: { type: string }
        fact: { type: string }
        category: { type: string }
    PrivateMemoryList:
      type: object
      required: [facts]
      properties:
        facts:
          type: array
          items: { $ref: "#/components/schemas/PrivateMemory" }
    MemoryResult:
      type: object
      required: [fact]
      properties:
        fact: { $ref: "#/components/schemas/PrivateMemory" }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Conversation:
      type: object
      properties:
        id:
          type: string
        deviceId:
          type: string
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - deviceId
        - title
        - createdAt
        - updatedAt

    CreateConversationBody:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
      required:
        - id

    ConversationMessage:
      type: object
      properties:
        id:
          type: string
        conversationId:
          type: string
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt

    CreateMessageBody:
      type: object
      properties:
        messageId:
          type: string
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
      required:
        - messageId
        - role
        - content

  responses:
    ErrorResponse:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
            required:
              - error

